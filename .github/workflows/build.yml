name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew jar --no-daemon

      - name: Find built jar
        id: findjar
        run: |
          JAR_PATH=$(find build/libs -name "createinstruments-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -type f | head -1)
          echo "jar_path=${JAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.findjar.outputs.jar_name }}
          path: ${{ steps.findjar.outputs.jar_path }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/createinstruments-*.jar"
          generate_release_notes: true
